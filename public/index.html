
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Browser theme -->
    <meta name="theme-color" content="#fbf8f1" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>
      Aristara Construction | Interior Design & Construction in Coimbatore
    </title>

    <meta
      name="description"
      content="Aristara Construction offers residential construction, interior design, home renovations, modular kitchens, painting, and complete space solutions in Coimbatore, Tamil Nadu."
    />

    <meta
      name="keywords"
      content="Aristara Construction, interior design Coimbatore, home interiors Coimbatore, house construction Coimbatore, residential construction Tamil Nadu, modular kitchens, home renovation, painting services, commercial construction"
    />

    <meta name="author" content="Aristara Construction" />
    <meta name="robots" content="index, follow" />

    <!-- Replace with your actual production domain -->
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta
      property="og:site_name"
      content="Aristara Construction"
    />

    <meta
      property="og:title"
      content="Aristara Construction | Design. Build. Transform."
    />

    <meta
      property="og:description"
      content="Thoughtfully designed interiors and quality construction solutions in Coimbatore, Tamil Nadu."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:url"
      content="https://www.example.com/"
    />

    <meta
      property="og:image"
      content="https://www.example.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Aristara Construction interior design and construction projects"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Aristara Construction | Design. Build. Transform."
    />

    <meta
      name="twitter:description"
      content="Interior design, residential construction, and renovation solutions in Coimbatore."
    />

    <meta
      name="twitter:image"
      content="https://www.example.com/og-image.jpg"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
      sizes="any"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <meta
      name="application-name"
      content="Aristara Construction"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent the initial document background from defaulting to blue/black -->
    <style>
      html {
        min-height: 100%;
        background-color: #fbf8f1;
        scroll-behavior: auto;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background-color: #fbf8f1;
        color: #29261f;
        font-family: "Poppins", sans-serif;
        overflow-x: clip;
      }

      #root {
        min-height: 100vh;
        background-color: #fbf8f1;
      }

      html.lenis,
      html.lenis body {
        background-color: #fbf8f1;
      }

      html.lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run Aristara Construction.
    </noscript>

    <div
      id="root"
      style="min-height: 100vh; background-color: #fbf8f1;"
    ></div>
  </body>
</html>
